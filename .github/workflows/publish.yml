name: Generate & Publish Calendar

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "scripts/**"
      - "requirements.txt"
  schedule:
    # 每年 1 月 2 日 02:00 UTC — 国务院通常在 12 月底发布次年公告
    - cron: "0 2 2 1 *"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # 1. 从 holiday-cn 拉取最新官方节假日（网络失败不阻断构建）
      - name: Fetch official holiday data
        run: python scripts/fetch_holidays.py
        continue-on-error: true

      # 2. 天文计算节气（无网络依赖，始终精确）
      - name: Calculate solar terms
        run: python scripts/calc_solar_terms.py

      # 3. 合并生成 ICS
      - name: Generate ICS
        run: python scripts/generate.py

      - name: Prepare deploy directory
        run: |
          cp index.html output/index.html
          touch output/.nojekyll

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          force_orphan: true
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
          commit_message: "chore: auto-update calendar [${{ github.sha }}]"
